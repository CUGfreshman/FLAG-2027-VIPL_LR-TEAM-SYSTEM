[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flag2027-sixbranch"
version = "1.0.0"
description = "Frozen-encoder six-branch face-voice verification for FLAG 2027"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flag2027.encoders" = [
    "reference/*.md",
    "reference/*/*.json",
    "reference/*/*.md",
    "reference/*/*/*.json",
    "reference/*/*/*.md",
    "reference/*/*/*.txt",
    "reference/*/*/*.yaml",
]
